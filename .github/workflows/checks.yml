# GitHub Pages serves main as-is, so these run before anything merges.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate HTML
        run: bunx html-validate@11.17.0 index.html luminous/index.html

      - name: Translations, screenshots, and app metadata
        run: bun scripts/check-site.ts

      # Local files only: external sites are left out so the check can't flake.
      - name: Local links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }} index.html luminous/index.html luminous/llms.txt
          fail: true
