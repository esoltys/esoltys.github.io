function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function textOnlyHtml(f) {
  return '<div style="display:flex; flex-direction:column; gap:14px;">'
    + '<div style="font-family:\'Inter\',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:' + f.overlineColor + ';">' + escapeHtml(f.overline) + '</div>'
    + '<div style="font-family:\'Expose\',sans-serif; font-weight:600; font-size:26px; letter-spacing:-0.01em;">' + escapeHtml(f.title) + '</div>'
    + '<div style="font-size:15px; line-height:1.7; color:#9aa0b4;">' + escapeHtml(f.body) + '</div>'
    + '</div>';
}

function featureRowHtml(f, suffix) {
  const isDual = !!f.dual;
  let media;
  if (isDual) {
    media = '<div style="flex:1 1 420px; display:flex; gap:16px;">'
      + '<div style="flex:1; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.dual + '-' + suffix + '.png?v=1786170282023" alt="' + escapeHtml(f.alt) + '" /></div>'
      + '<div style="flex:1; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.dual + '-hover-' + suffix + '.png?v=1786170282023" alt="' + escapeHtml(f.alt) + ' hover" /></div>'
      + '</div>';
  } else {
    media = '<div style="flex:1 1 420px; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.img + '-' + suffix + '.png?v=1786170282023" alt="' + escapeHtml(f.alt) + '" /></div>';
  }
  const text = '<div style="flex:1 1 380px; display:flex; flex-direction:column; gap:14px;">'
    + '<div style="font-family:\'Inter\',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:' + f.overlineColor + ';">' + escapeHtml(f.overline) + '</div>'
    + '<div style="font-family:\'Expose\',sans-serif; font-weight:600; font-size:30px; letter-spacing:-0.01em;">' + escapeHtml(f.title) + '</div>'
    + '<div style="font-size:15px; line-height:1.7; color:#9aa0b4; max-width:440px;">' + escapeHtml(f.body) + '</div>'
    + '</div>';
  return '<div style="display:flex; align-items:center; gap:56px; flex-wrap:wrap;">'
    + (f.reverse ? media + text : text + media)
    + '</div>';
}

function render(lang) {
  const suffix = lang === "fr" ? "FR" : "EN";
  const d = DICT[lang];
  document.getElementById('hero-badge').textContent = d.hero.badge;
  document.getElementById('hero-title').textContent = d.hero.title;
  document.getElementById('hero-sub').textContent = d.hero.sub;
  document.getElementById('hero-caption').textContent = d.hero.captionLine1;
  document.getElementById('qi-title').textContent = d.hero.qiTitle;
  document.getElementById('qi-intro').innerHTML = d.hero.qiIntro;
  document.getElementById('qi-windows').innerHTML = d.hero.qiWindows;
  document.getElementById('qi-linux').innerHTML = d.hero.qiLinux;
  document.getElementById('qi-winget').innerHTML = d.hero.qiWinget;
  document.getElementById('qi-store').innerHTML = d.hero.qiStore;
  document.getElementById('hero-img').src = './landing-assets/home-' + suffix + '.png?v=1786170282023';
  document.getElementById('hero-img').alt = d.hero.heroImgAlt;
  document.getElementById('footer-copyright').innerHTML = escapeHtml(d.footer.copyright).replace('Eric James Soltys', '<a href="https://esoltys.dev" style="color:#6d7286; text-decoration:underline;">Eric James Soltys</a>');
  document.getElementById('footer-github').textContent = d.footer.github;
  document.getElementById('footer-releases').textContent = d.footer.releases;
  document.getElementById('footer-license').textContent = d.footer.license;
  const rows = [];
  let i = 0;
  while (i < d.features.length) {
    const f = d.features[i];
    if (!f.img && !f.dual) {
      const group = [];
      let j = i;
      while (j < d.features.length && !d.features[j].img && !d.features[j].dual) {
        group.push(d.features[j]);
        j++;
      }
      const cols = Math.min(group.length, 3);
      rows.push('<div style="display:grid; grid-template-columns:repeat(' + cols + ', 1fr); gap:56px;">' + group.map(textOnlyHtml).join('') + '</div>');
      i = j;
      continue;
    }
    rows.push(featureRowHtml(f, suffix));
    i += 1;
  }
  document.getElementById('features').innerHTML = rows.join('');
  document.getElementById('btn-en').style.background = lang === 'en' ? '#f1f3f8' : 'transparent';
  document.getElementById('btn-en').style.color = lang === 'en' ? '#08090c' : '#9aa0b4';
  document.getElementById('btn-fr').style.background = lang === 'fr' ? '#f1f3f8' : 'transparent';
  document.getElementById('btn-fr').style.color = lang === 'fr' ? '#08090c' : '#9aa0b4';
  document.documentElement.lang = lang;
}

function setLang(lang) { render(lang); }
render('en');
</script>
