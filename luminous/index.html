      captionLine2: "Made in Canada \uD83C\uDF41 Available in English and French.",
      heroImgAlt: "Luminous home screen"

    footer: { copyright: "\u00A9 2026 Eric James Soltys. Licensed under the MIT License.", github: "GitHub", releases: "Releases", license: "License" },
    features: [
      { overlineColor: "#8b93d5", overline: "Local & instant", title: "Your library, indexed and instant.", body: "Every track stays on your disk — Luminous just makes it fast to find. Search across artists, albums, songs, and lyrics as you type, with a now-playing bar that's always one click away.", img: "albums", alt: "Albums view", reverse: false },
      { overlineColor: "#FFB648", overline: "Smarter playlists", title: "Playlists that build themselves.", body: "Create smart playlists from your own rules, or drop into auto playlists already built around decades and genres — always up to date as your library grows.", img: "playlist-auto", alt: "Auto and smart playlists", reverse: true },
      { overlineColor: "#8b93d5", overline: "Stay in the flow", title: "A miniplayer for quick skips, without the whole window.", body: "Shrink Luminous to a compact, always-on-top miniplayer for quick skips while you work — full playback controls, a fraction of the footprint.", dual: "miniplayer", alt: "Miniplayer", reverse: false },
      { overlineColor: "#8b93d5", overline: "Clean metadata", title: "Tag editing that stays out of your way.", body: "Fix a title, artist, or album straight from the track — no external tools needed. Edit tags one song at a time or in bulk, and keep your library consistent.", img: "song-tag-editor", alt: "Song tag editor", reverse: true },
      { overlineColor: "#FFB648", overline: "Make it yours", title: "A player that matches your music, not the other way around.", body: "Choose from four crafted themes, or turn on the dynamic theme and watch the whole interface repaint itself around every album's cover art — no two sessions look the same.", img: "themes", alt: "Theme picker", reverse: false },
      { overlineColor: "#8b93d5", overline: "Tidy by default", title: "Organize your files, automatically.", body: "Point Luminous at a messy folder and it sorts files into a clean artist/album structure on disk, renaming as it goes — your library stays organized without you touching a thing.", img: "settings-organize", alt: "Library organization settings", reverse: true },

    ]
  },
  fr: {
    nav: { features: "Fonctionnalités", download: "Télécharger" },
    hero: {
      badge: "Lecteur de musique de bureau",
      title: "Un lecteur performant pour la musique que vous possédez déjà.",
      sub: "Luminous est un lecteur rapide et local pour votre propre bibliothèque audio — sans diffusion en continu, sans abonnement, sans infonuagique. Juste vos fichiers, indexés, cherchables et magnifiquement joués.",

      btnGithub: "Voir sur GitHub",
      captionLine1: "Gratuit et à code source ouvert. Obtenez la dernière version pour Windows ou Linux.",
      captionLine2: "Fait au Canada \uD83C\uDF41 Offert en anglais et en français.",

    footer: { copyright: "\u00A9 2026 Eric James Soltys. Sous licence MIT.", github: "GitHub", releases: "Versions", license: "Licence" },
    features: [
      { overlineColor: "#8b93d5", overline: "Local et instantané", title: "Votre bibliothèque, indexée et instantanée.", body: "Chaque piste reste sur votre disque — Luminous la retrouve simplement plus vite. Cherchez parmi les artistes, albums, chansons et paroles en tapant, avec une barre de lecture toujours à portée de clic.", img: "albums", alt: "Vue des albums", reverse: false },
      { overlineColor: "#FFB648", overline: "Listes plus intelligentes", title: "Des listes de lecture qui se construisent seules.", body: "Créez des listes de lecture intelligentes selon vos propres règles, ou plongez dans des listes automatiques déjà bâties par décennie et par genre — toujours à jour à mesure que votre bibliothèque grandit.", img: "playlist-auto", alt: "Listes de lecture automatiques et intelligentes", reverse: true },
      { overlineColor: "#8b93d5", overline: "Restez dans le rythme", title: "Un mini-lecteur pour passer d'une chanson à l'autre, sans la fenêtre complète.", body: "Réduisez Luminous en un mini-lecteur compact, toujours au premier plan, pour passer rapidement d'une chanson à l'autre pendant que vous travaillez — tous les contrôles de lecture, une fraction de l'espace.", dual: "miniplayer", alt: "Mini-lecteur", reverse: false },
      { overlineColor: "#8b93d5", overline: "Métadonnées propres", title: "Une édition des balises qui reste discrète.", body: "Corrigez un titre, un artiste ou un album directement depuis la chanson — aucun outil externe requis. Modifiez les balises une chanson à la fois ou en lot, et gardez votre bibliothèque cohérente.", img: "song-tag-editor", alt: "Éditeur de balises de chanson", reverse: true },
      { overlineColor: "#FFB648", overline: "Faites-le vôtre", title: "Un lecteur qui s'accorde à votre musique.", body: "Choisissez parmi quatre thèmes soignés, ou activez le thème dynamique et regardez toute l'interface se repeindre selon la pochette de chaque album — jamais deux séances pareilles.", img: "themes", alt: "Sélecteur de thèmes", reverse: false },
      { overlineColor: "#8b93d5", overline: "Ordre par défaut", title: "Organisez vos fichiers, automatiquement.", body: "Pointez Luminous vers un dossier en désordre et il trie les fichiers en une structure claire artiste/album sur le disque, en les renommant au passage — votre bibliothèque reste organisée sans que vous n'ayez à y toucher.", img: "settings-organize", alt: "Paramètres d'organisation de la bibliothèque", reverse: true },
      { overlineColor: "#FFB648", overline: "Paroles synchronisées", title: "Suivez, ligne par ligne.", body: "Les paroles synchronisées suivent la chanson en temps réel, avec une édition intégrée quand le minutage a besoin d'un ajustement. Paroles introuvables? Ajoutez et synchronisez les vôtres.", img: "lyrics", alt: "Écran de paroles synchronisées", reverse: false },

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function featureRowHtml(f, suffix) {
  const isDual = !!f.dual;
  let media;
  if (isDual) {
    media = '<div style="flex:1 1 420px; display:flex; gap:16px;">'
      + '<div style="flex:1; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.dual + '-' + suffix + '.png?v=1785342382942" alt="' + escapeHtml(f.alt) + '" /></div>'
      + '<div style="flex:1; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.dual + '-hover-' + suffix + '.png?v=1785342382942" alt="' + escapeHtml(f.alt) + ' hover" /></div>'
      + '</div>';
  } else {
    media = '<div style="flex:1 1 420px; border-radius:14px; overflow:hidden; border:1px solid #23262f; box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);"><img src="./landing-assets/' + f.img + '-' + suffix + '.png?v=1785342382942" alt="' + escapeHtml(f.alt) + '" /></div>';
  }
  const text = '<div style="flex:1 1 380px; display:flex; flex-direction:column; gap:14px;">'
    + '<div style="font-family:\'Inter\',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:' + f.overlineColor + ';">' + escapeHtml(f.overline) + '</div>'
    + '<div style="font-family:\'Space Grotesk\',sans-serif; font-weight:600; font-size:30px; letter-spacing:-0.01em;">' + escapeHtml(f.title) + '</div>'
    + '<div style="font-size:15px; line-height:1.7; color:#9aa0b4; max-width:440px;">' + escapeHtml(f.body) + '</div>'
    + '</div>';
  return '<div style="display:flex; align-items:center; gap:56px; flex-wrap:wrap;">'
    + (f.reverse ? media + text : text + media)
    + '</div>';
}

function render(lang) {
  const suffix = lang === "fr" ? "FR" : "EN";
  const d = DICT[lang];
  document.getElementById('hero-badge').textContent = d.hero.badge;
  document.getElementById('hero-title').textContent = d.hero.title;
  document.getElementById('hero-sub').textContent = d.hero.sub;
  document.getElementById('hero-btn-download').textContent = d.hero.btnDownload;
  document.getElementById('hero-btn-github').textContent = d.hero.btnGithub;
  document.getElementById('hero-caption').innerHTML = escapeHtml(d.hero.captionLine1) + '<br />' + escapeHtml(d.hero.captionLine2);
  document.getElementById('hero-img').src = './landing-assets/home-' + suffix + '.png';
  document.getElementById('hero-img').alt = d.hero.heroImgAlt;
  document.getElementById('footer-copyright').innerHTML = escapeHtml(d.footer.copyright).replace('Eric James Soltys', '<a href="https://esoltys.dev" style="color:#6d7286; text-decoration:underline;">Eric James Soltys</a>');
  document.getElementById('footer-github').textContent = d.footer.github;
  document.getElementById('footer-releases').textContent = d.footer.releases;
  document.getElementById('footer-license').textContent = d.footer.license;
  document.getElementById('features').innerHTML = d.features.map(f => featureRowHtml(f, suffix)).join('');
  document.getElementById('btn-en').style.background = lang === 'en' ? '#f1f3f8' : 'transparent';
  document.getElementById('btn-en').style.color = lang === 'en' ? '#08090c' : '#9aa0b4';
  document.getElementById('btn-fr').style.background = lang === 'fr' ? '#f1f3f8' : 'transparent';
  document.getElementById('btn-fr').style.color = lang === 'fr' ? '#08090c' : '#9aa0b4';
  document.documentElement.lang = lang;
}

function setLang(lang) { render(lang); }
render('en');
</script>
</body>
